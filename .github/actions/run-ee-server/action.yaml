name: "Run EE Server"
description: "Run EE server. Returns once server is ready. Only tested on Linux and macOS"

permissions:
  id-token: write
  contents: read

inputs:
  # All inputs in composite actions are strings
  server-tag:
    description: Server version to use
    required: false
    default: "latest"
  container-repo-url:
    required: false
    description: Container repo url
    default: aerospike.jfrog.io/docker/
  jfrog-platform-url:
    description: "JFrog platform url"
    required: false
    default: https://aerospike.jfrog.io
  oidc-provider:
    description: "OIDC provider name"
    required: false
  oidc-audience:
    description: "OIDC audience"
    required: false
  docker-hub-username:
    description: "Docker Hub username (for non-JFrog registries)"
    required: false
    default: ""
  docker-hub-password:
    description: "Docker Hub password (for non-JFrog registries)"
    required: false
    default: ""
  container-name:
    default: aerospike
    required: false
    description: Name for test container
  server-type:
    required: true
    default: aerospike-enterprise-server
    description: Server type `aerospike-server` or `aerospike-enterprise-server` 

runs:
  using: "composite"
  steps:
    - name: Set up JFrog credentials
      id: setup-jfrog-cli
      uses: jfrog/setup-jfrog-cli@v4
      env:
        JF_URL: ${{ inputs.jfrog-platform-url }}
        JF_PROJECT: database
      with:
        oidc-provider-name: ${{ inputs.oidc-provider }}
        oidc-audience: ${{ inputs.oidc-audience }}

    - name: Docker login
      run: |
        if [[ "${{ inputs.container-repo-url }}" == *"jfrog.io"* ]]; then
          echo "Logging in to JFrog registry..."
          echo "${{ steps.setup-jfrog-cli.outputs.oidc-token }}" | docker login ${{ inputs.container-repo-url }} --username ${{ steps.setup-jfrog-cli.outputs.oidc-user }} --password-stdin
        elif [[ -n "${{ inputs.docker-hub-username }}" ]] && [[ -n "${{ inputs.docker-hub-password }}" ]]; then
          echo "Logging in to Docker registry..."
          echo "${{ inputs.docker-hub-password }}" | docker login ${{ inputs.container-repo-url }} --username ${{ inputs.docker-hub-username }} --password-stdin
        else
          echo "No credentials provided, skipping docker login"
        fi
      shell: bash

    - run: echo IMAGE_NAME=${{ inputs.container-repo-url }}aerospike/${{ inputs.server-type }}:${{ inputs.server-tag }} >> $GITHUB_ENV
      shell: bash

    - run: docker run -d --name ${{ inputs.container-name }} -p 3000:3000 ${{ env.IMAGE_NAME }}
      shell: bash

    - uses: ./.github/actions/wait-for-as-server-to-start
      with:
        container-name: ${{ inputs.container-name }}
        is-security-enabled: true
        is-strong-consistency-enabled: true

    # Steps performed after server is ready. We should move this ideally to a file which can be read in the configure/stage database before running tests.
    - run: docker exec ${{ inputs.container-name }} asadm --enable -e 'asinfo -v "roster-set:namespace=test;nodes=A1"'
      shell: bash

    - run: docker exec ${{ inputs.container-name }} asadm --enable -e 'asinfo -v revive:'
      shell: bash

    - run: docker exec ${{ inputs.container-name }} asadm --enable -e 'asinfo -v recluster:'
      shell: bash

    - run: docker logs ${{ inputs.container-name }}
      shell: bash