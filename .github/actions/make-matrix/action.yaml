name: Make Server Matrix
description: Builds a server matrix from JSON or file; Go version is passed separately.

inputs:
  default_json:
    description: Preprocessed JSON of servers (with versions).
    required: true
  test_servers_file_path:
    description: Repo-relative path to server matrix file (optional).
    required: false
  go_version:
    description: Go version to inject into each matrix entry.
    required: true

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        DEFAULT_JSON: ${{ inputs.default_json }}
        TEST_SERVERS_FILE_PATH: ${{ inputs.test_servers_file_path }}
        GO_VERSION: ${{ inputs.go_version }}
      run: |
        set -euo pipefail

        # Priority: file > default_json
        if [[ -n "${TEST_SERVERS_FILE_PATH:-}" && -s "${TEST_SERVERS_FILE_PATH}" ]]; then
          echo "Using ${TEST_SERVERS_FILE_PATH} from repository"
          JSON="$(cat "${TEST_SERVERS_FILE_PATH}")"
        else
          echo "Using preprocessed JSON input"
          JSON="${DEFAULT_JSON}"
        fi

        echo "Validating JSON..."
        if ! echo "${JSON}" | jq empty >/dev/null 2>&1; then
          echo "ERROR: Invalid JSON input"
          exit 1
        fi
        echo "JSON validation successful"

        echo "Building matrix with Go version: ${GO_VERSION}"
        MATRIX="$(echo "${JSON}" | jq -c --arg go "${GO_VERSION}" '[to_entries[] | { server: .key, go: $go } + .value]')"
        
        if [[ -z "${MATRIX}" || "${MATRIX}" == "null" || "${MATRIX}" == "[]" ]]; then
          echo "ERROR: Generated matrix is empty or null"
          exit 1
        fi
        
        # Show matrix configuration count without exposing credentials
        MATRIX_COUNT="$(echo "${MATRIX}" | jq 'length')"
        echo "Generated matrix with ${MATRIX_COUNT} configuration(s)"

        {
          echo "matrix<<__JSON__"
          echo "${MATRIX}"
          echo "__JSON__"
        } >> "$GITHUB_OUTPUT"

outputs:
  matrix:
    description: JSON array of server entries (includes server and go version)
    value: ${{ steps.build.outputs.matrix }}
