# Aerospike Go Client Tests
#
# Supports custom server configurations via workflow_dispatch
# - Use {{VAR_NAME}} placeholders for secrets (e.g., {{QE_DOCKER_USERNAME}})
# - Add secrets: Repository Settings → env section (line ~56) → JSON template
# - Fields: version (required), docker-user-name, docker-password, image-url (optional)

name: Aerospike Go Client Tests
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      server-config-json:
        description: 'Server configuration JSON template (use {{SECRET_NAME}} placeholders). Leave empty for default.'
        required: false
        type: string
        default: ''

env:
  AEROSPIKE_HOSTS: "127.0.0.1:3000"
  GODEBUG: fips140=only
  GOFIPS140: latest

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      go-version: ${{ steps.get-go-version.outputs.go-version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Go version
        id: get-go-version
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          echo "go-version=${GO_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Preprocess server configuration JSON
        id: preprocess-json
        env:
          INPUT_JSON: ${{ github.event.inputs.server-config-json || '' }}
          # Add your secrets here - they will be available as {{SECRET_NAME}} in templates
          DOCKER_USERNAME: ${{ secrets.TEST_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.TEST_DOCKER_PASSWORD }}
          DOCKER_URL: ${{ secrets.TEST_DOCKER_URL }}
          # Example: Add more credential sets as needed
          # REGISTRY2_USERNAME: ${{ secrets.REGISTRY2_USERNAME }}
          # REGISTRY2_PASSWORD: ${{ secrets.REGISTRY2_PASSWORD }}
          # REGISTRY2_URL: ${{ secrets.REGISTRY2_URL }}
        run: |
          set -euo pipefail
          
          # Default template with secret placeholders
          DEFAULT_TEMPLATE='{
            "stable": { "version": "ee-8.1.0.1" },
            "release": { "version": "ee-8.1.0.1_2" },
            "8.1.1-pr": { 
              "version": "x86-preview", 
              "docker-user-name": "{{DOCKER_USERNAME}}", 
              "docker-password": "{{DOCKER_PASSWORD}}", 
              "image-url": "{{DOCKER_URL}}" 
            }
          }'
          
          # Use input JSON if provided, otherwise use default template
          if [[ -n "${INPUT_JSON}" ]]; then
            echo "Using provided JSON template"
            TEMPLATE="${INPUT_JSON}"
          else
            echo "Using default JSON template"
            TEMPLATE="${DEFAULT_TEMPLATE}"
          fi
          
          # Use jq to replace placeholders with actual values
          PROCESSED_JSON=$(echo "${TEMPLATE}" | jq \
            --arg docker_user "${DOCKER_USERNAME:-}" \
            --arg docker_pass "${DOCKER_PASSWORD:-}" \
            --arg docker_url "${DOCKER_URL:-}" \
            '
            walk(
              if type == "string" then
                . | gsub("\\{\\{DOCKER_USERNAME\\}}"; $docker_user)
                  | gsub("\\{\\{DOCKER_PASSWORD\\}}"; $docker_pass)
                  | gsub("\\{\\{DOCKER_URL\\}}"; $docker_url)
              else
                .
              end
            )
            '
          )
          
          # Validate the processed JSON (suppress output to avoid leaking secrets)
          echo "Validating processed JSON..."
          if ! echo "${PROCESSED_JSON}" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Invalid JSON after preprocessing"
            exit 1
          fi
          
          # Count configurations without displaying content
          CONFIG_COUNT=$(echo "${PROCESSED_JSON}" | jq 'keys | length')
          echo "Preprocessing complete. Configuration count: ${CONFIG_COUNT}"
          
          # Output the processed JSON (not visible in logs, only in job outputs)
          {
            echo "processed_json<<__JSON__"
            echo "${PROCESSED_JSON}"
            echo "__JSON__"
          } >> "$GITHUB_OUTPUT"
      
      - name: Build matrix
        id: set-matrix
        env:
          PROCESSED_JSON: ${{ steps.preprocess-json.outputs.processed_json }}
          GO_VERSION: ${{ steps.get-go-version.outputs.go-version }}
        run: |
          set -euo pipefail
          
          echo "Building matrix with Go version: ${GO_VERSION}"
          MATRIX_ARRAY="$(echo "${PROCESSED_JSON}" | jq -c --arg go "${GO_VERSION}" '[to_entries[] | { server: .key, go: $go } + .value]')"
          
          if [[ -z "${MATRIX_ARRAY}" || "${MATRIX_ARRAY}" == "null" || "${MATRIX_ARRAY}" == "[]" ]]; then
            echo "ERROR: Generated matrix is empty or null"
            exit 1
          fi
          
          MATRIX="$(echo "${MATRIX_ARRAY}" | jq -c '{include: .}')"
          
          MATRIX_COUNT="$(echo "${MATRIX_ARRAY}" | jq 'length')"
          echo "Generated matrix with ${MATRIX_COUNT} configuration(s)"
          echo "Matrix length: ${#MATRIX}"
          
          # Write the output
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          
      - name: dump matrix 
        run: |
          echo "Job will output matrix value from step:"
          echo "Value: ${{ steps.set-matrix.outputs.matrix }}"

  build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: "Setup Go ${{ needs.setup-matrix.outputs.go-version }}"
        uses: actions/setup-go@v4
        with:
          go-version: "${{ needs.setup-matrix.outputs.go-version }}"
          cache: true
      - name: Fetch dependencies
        env:
          GODEBUG: fips140=on
        run: |
          # Install all dependencies
          go mod download

          # Install ginkgo CLI and gocovmerge for testing
          go install github.com/onsi/ginkgo/v2/ginkgo@v2.22.2
          go mod download github.com/wadey/gocovmerge

          # Vendor the dependencies
          go mod vendor

      - name: Display Go version
        run: go version
      
      - name: Set up Aerospike Database
        uses: ./.github/actions/run-ee-server
        with:
          server-tag: ${{ matrix.version }}
          docker-hub-username: ${{ matrix.docker-user-name || '' }}
          docker-hub-password: ${{ matrix.docker-password || '' }}
          container-repo-url: ${{ matrix.image-url || 'aerospike.jfrog.io/docker/' }}
          oidc-provider: ${{ secrets.JFROG_OIDC_PROVIDER || 'github-aerospike' }}
          oidc-audience: ${{ secrets.JFROG_OIDC_AUDIENCE || 'jfrog-aerospike' }}

      - name: Test Lua Code
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites internal/lua
      - name: Test types package
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites types
      - name: Test pkg tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -cover -race -r -keep-going -succinct -randomize-suites pkg
      - name: Build Benchmark tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/benchmark | go build -mod=vendor -tags as_proxy -o benchmark .
      - name: Build asinfo tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/asinfo | go build -mod=vendor -o asinfo .
      - name: Build cli tool
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: cd tools/cli | go build -mod=vendor -o cli .
      - name: Build example files
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: find examples -name "*.go" -type f -print0 | xargs -0 -n1 go build
      - name: Build with Reflection code removed
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo build -tags="as_performance" .
      - name: Build for Google App Engine (unsafe package removed)
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo build -tags="app_engine" .
      - name: Run the tests
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/onsi/ginkgo/v2/ginkgo -coverprofile=./cover_native.out -covermode=atomic -coverpkg=./... -race -keep-going -succinct -randomize-suites -skip="HyperLogLog"
      - name: Combine Cover Profiles
        env: {GOPROXY: off, GOSUMDB: off, GOFLAGS: -mod=vendor}
        run: go run -mod=vendor github.com/wadey/gocovmerge cover_*.out > cover_all.out
      - name: Check Code Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          # Configure action using config file (option 1)
          config: ./.testcoverage.yml
